<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Simiriyuu — Área de procesos</title>
<style>

/* ============================================================
   CONFIGURACIÓN — editar estos valores antes de desplegar
   ============================================================ */

:root {
  --c-ink:       #1E1030;
  --c-ink-soft:  #2A1B42;
  --c-paper:     #F4EFE6;
  --c-recep:     #52ACAA;   /* teal institucional — recepción de mercancía */
  --c-recep-d:   #337E7C;
  --c-proc:      #5B3088;   /* morado institucional — procesos */
  --c-proc-d:    #3D1F5C;
  --c-warn:      #B23A2E;
  --c-line:      rgba(244,239,230,0.18);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--c-ink);
  color: var(--c-paper);
  font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}

#app { height: 100vh; width: 100vw; position: relative; }
.screen {
  position: absolute; inset: 0;
  display: none;
  flex-direction: column;
}
.screen.active { display: flex; }

/* ---------- pantalla de inicio ---------- */

#home {
  align-items: center;
  justify-content: center;
  gap: 4vh;
  padding: 6vh 6vw;
}
#home .brand {
  display: flex;
  align-items: center;
  gap: 2vw;
}
#home .brand img {
  height: clamp(48px, 6vw, 90px);
  width: auto;
}
#home .brand .brand-text {
  font-size: clamp(28px, 4vw, 44px);
  letter-spacing: 0.04em;
  opacity: 0.9;
  text-transform: uppercase;
}
#home .buttons {
  display: flex;
  gap: 5vw;
  width: 100%;
  justify-content: center;
}
.big-btn {
  flex: 1;
  max-width: 480px;
  min-height: 42vh;
  border-radius: 28px;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3vh;
  cursor: pointer;
  color: var(--c-paper);
  font-family: inherit;
  transition: transform 0.15s ease;
}
.big-btn:active { transform: scale(0.97); }
.big-btn.recep { background: linear-gradient(160deg, var(--c-recep), var(--c-recep-d)); }
.big-btn.proc  { background: linear-gradient(160deg, var(--c-proc), var(--c-proc-d)); }
.big-btn .icon { font-size: clamp(64px, 9vw, 110px); line-height: 1; }
.big-btn .label { font-size: clamp(30px, 3.6vw, 46px); font-weight: 600; text-align: center; padding: 0 20px; }
.big-btn .sub { font-size: clamp(16px, 1.6vw, 22px); opacity: 0.85; text-align: center; padding: 0 30px; }

#home .footer-note {
  position: absolute;
  bottom: 3vh;
  font-size: 15px;
  opacity: 0.4;
}

/* ---------- pantalla de resumen ---------- */

#resumen {
  padding: 5vh 6vw;
  justify-content: flex-start;
}
#resumen.tipo-recepcion { background: linear-gradient(170deg, var(--c-recep), var(--c-recep-d)); }
#resumen.tipo-proceso   { background: linear-gradient(170deg, var(--c-proc), var(--c-proc-d)); }

.res-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 2px solid var(--c-line);
  padding-bottom: 2vh;
  margin-bottom: 4vh;
}
.res-header .tag {
  font-size: clamp(22px, 2.6vw, 32px);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
}
.res-header .time {
  font-size: clamp(18px, 2vw, 24px);
  opacity: 0.85;
}

.res-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 3vh; }

/* filas de producto (recepción) */
.item-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 3vw;
  border-bottom: 1px solid var(--c-line);
  padding-bottom: 2.4vh;
}
.item-row .prod {
  font-size: clamp(30px, 4.4vw, 56px);
  font-weight: 700;
}
.item-row .qty {
  font-size: clamp(38px, 5.6vw, 72px);
  font-weight: 800;
  white-space: nowrap;
}
.item-row .prov {
  font-size: clamp(18px, 2.1vw, 26px);
  opacity: 0.85;
  display: block;
  margin-top: 0.6vh;
}

/* bloques entra/sale (proceso) */
.flow-block {
  border-radius: 20px;
  background: rgba(0,0,0,0.18);
  padding: 3vh 3vw;
}
.flow-block .flow-label {
  font-size: clamp(20px, 2.4vw, 28px);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.8;
  margin-bottom: 1.4vh;
}
.flow-block .prod {
  font-size: clamp(32px, 4.6vw, 58px);
  font-weight: 700;
}
.flow-block .qty {
  font-size: clamp(40px, 6vw, 78px);
  font-weight: 800;
}
.flow-arrow {
  text-align: center;
  font-size: clamp(30px, 4vw, 44px);
  opacity: 0.7;
}
.byproducts {
  font-size: clamp(18px, 2vw, 24px);
  opacity: 0.9;
  margin-top: 1.6vh;
}

.res-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 2vh;
}
#countdown-bar {
  height: 6px;
  background: rgba(244,239,230,0.25);
  border-radius: 3px;
  overflow: hidden;
  flex: 1;
  margin-right: 4vw;
}
#countdown-fill {
  height: 100%;
  background: var(--c-paper);
  width: 100%;
  transition: width 1s linear;
}
.new-btn {
  border: none;
  border-radius: 16px;
  padding: 2vh 3vw;
  font-size: clamp(18px, 2vw, 24px);
  font-weight: 700;
  background: var(--c-paper);
  color: var(--c-ink);
  cursor: pointer;
}

/* ---------- estados: cargando / sin dato / sin conexión ---------- */

.state-msg {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2vh;
  text-align: center;
}
.state-msg .big { font-size: clamp(28px, 3.4vw, 42px); font-weight: 700; }
.state-msg .small { font-size: clamp(16px, 1.8vw, 22px); opacity: 0.8; max-width: 60vw; }

#stale-banner {
  display: none;
  background: var(--c-warn);
  color: var(--c-paper);
  text-align: center;
  padding: 1.4vh;
  font-size: clamp(15px, 1.6vw, 20px);
  font-weight: 700;
  letter-spacing: 0.03em;
}
#stale-banner.show { display: block; }

/* ---------- modo vista previa (solo para revisar el diseño ahora) ---------- */

#preview-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: #000;
  color: #fff;
  font-size: 13px;
  padding: 8px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  z-index: 999;
  opacity: 0.85;
}
#preview-bar button {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #555;
  background: #1a1a1a;
  color: #fff;
  cursor: pointer;
}
#preview-bar span { opacity: 0.6; }

</style>
</head>

  <button onclick="renderDemo('proceso_lote')">Demo proceso (con subproductos)</button>
</div>

<script>

/* ============================================================
   CONFIGURACIÓN — completar antes de desplegar en la tablet
   ============================================================ */
const CONFIG = {
  // URL del formulario web (Enketo) de recepción, con el returnUrl
  // apuntando de vuelta a esta misma página. Kobo agrega el ID de
  // la sumisión al volver — hay que confirmar el nombre exacto del
  // parámetro que usa tu instancia (suele venir en el query string
  // de la URL de retorno, revisar al probar el primer envío real).
  urlFormRecepcion: "https://ee.kobotoolbox.org/x/E2Qc4gmB"
    + "?returnUrl=" + encodeURIComponent(location.origin + location.pathname + "?view=resumen&tipo=recepcion"),

  urlFormProceso: "https://ee.kobotoolbox.org/x/eTyzkimJ"
    + "?returnUrl=" + encodeURIComponent(location.origin + location.pathname + "?view=resumen&tipo=proceso"),

  // Endpoint liviano (n8n) que devuelve el JSON ya traducido
  // (códigos -> nombres reales) de una sumisión por su id.
  // Ejemplo esperado de respuesta, ver parseSummary() más abajo.
  dataEndpoint: "https://REEMPLAZAR-n8n.tu-dominio.com/webhook/resumen",

  // Cada cuántos segundos vuelve solo a la pantalla de inicio
  autoReturnSeconds: 25,

  // Si el dato mostrado tiene más de este tiempo (segundos), se
  // considera "viejo" y se muestra el aviso de sin conexión.
  staleAfterSeconds: 90,
};

/* ============================================================
   Formato esperado de la respuesta del endpoint (dataEndpoint):

   Recepción:
   {
     "tipo": "recepcion",
     "timestamp": "2026-08-15T14:32:00Z",
     "proveedor": "Pescados del Caribe SAS",
     "items": [
       { "producto": "Filete de medregal", "cantidad": 32.9, "unidad": "kg" },
       { "producto": "Camarón grande",      "cantidad": 10,   "unidad": "kg" }
     ]
   }

   Proceso:
   {
     "tipo": "proceso",
     "timestamp": "2026-08-15T14:40:00Z",
     "procesos": ["Fileteado", "Descamado"],
     "entra": [ { "producto": "Medregal entero", "cantidad": 60.9, "unidad": "kg" } ],
     "sale":  [ { "producto": "Filete de medregal", "cantidad": 32.9, "unidad": "kg" } ],
     "subproductos": [
       { "producto": "Cabezas de pescado",  "cantidad": 8.2, "unidad": "kg" },
       { "producto": "Cachetes de pescado", "cantidad": 1.1, "unidad": "kg" }
     ]
   }
   ============================================================ */

let returnTimer = null;
let countdownInterval = null;

function goToForm(tipo) {
  window.location.href = tipo === "recepcion" ? CONFIG.urlFormRecepcion : CONFIG.urlFormProceso;
}

function showHome() {
  clearTimers();
  document.getElementById("home").classList.add("active");
  document.getElementById("resumen").classList.remove("active");
  document.getElementById("resumen").className = "screen";
}

function showResumenShell(tipo) {
  document.getElementById("home").classList.remove("active");
  const res = document.getElementById("resumen");
  res.className = "screen active tipo-" + (tipo === "recepcion" ? "recepcion" : "proceso");
}

function startAutoReturn() {
  clearTimers();
  let remaining = CONFIG.autoReturnSeconds;
  const fill = document.getElementById("countdown-fill");
  if (fill) fill.style.width = "100%";
  countdownInterval = setInterval(() => {
    remaining -= 1;
    if (fill) fill.style.width = Math.max(0, (remaining / CONFIG.autoReturnSeconds) * 100) + "%";
    if (remaining <= 0) showHome();
  }, 1000);
}

function clearTimers() {
  if (returnTimer) clearTimeout(returnTimer);
  if (countdownInterval) clearInterval(countdownInterval);
}

function fmtTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return "—"; }
}

function secondsSince(iso) {
  try { return (Date.now() - new Date(iso).getTime()) / 1000; } catch (e) { return Infinity; }
}

function renderItemRows(items) {
  return items.map(it => `
    <div class="item-row">
      <div>
        <div class="prod">${escapeHtml(it.producto)}</div>
      </div>
      <div class="qty">${it.cantidad} ${escapeHtml(it.unidad)}</div>
    </div>
  `).join("");
}

function renderRecepcion(data) {
  showResumenShell("recepcion");
  const html = `
    <div class="res-header">
      <div class="tag">Recepción registrada</div>
      <div class="time">${fmtTime(data.timestamp)}</div>
    </div>
    <div class="res-body">
      <div style="font-size:clamp(20px,2.2vw,28px); opacity:0.9;">Proveedor: <strong>${escapeHtml(data.proveedor || "—")}</strong></div>
      ${renderItemRows(data.items || [])}
    </div>
    <div class="res-footer">
      <div id="countdown-bar"><div id="countdown-fill"></div></div>
      <button class="new-btn" onclick="showHome()">Nuevo registro</button>
    </div>
  `;
  document.getElementById("resumen-content").innerHTML = html;
  startAutoReturn();
  checkStale(data.timestamp);
}

function renderProceso(data) {
  showResumenShell("proceso");
  const procesos = (data.procesos || []).join(", ");
  const sub = (data.subproductos || []).filter(s => s.cantidad > 0);
  const html = `
    <div class="res-header">
      <div class="tag">Proceso registrado</div>
      <div class="time">${fmtTime(data.timestamp)}</div>
    </div>
    <div class="res-body">
      <div style="font-size:clamp(18px,2vw,24px); opacity:0.85;">${escapeHtml(procesos)}</div>
      <div class="flow-block">
        <div class="flow-label">Entra al proceso</div>
        ${renderItemRows(data.entra || [])}
      </div>
      <div class="flow-arrow">↓</div>
      <div class="flow-block">
        <div class="flow-label">Sale del proceso</div>
        ${renderItemRows(data.sale || [])}
        ${sub.length ? `<div class="byproducts">+ ${sub.map(s => `${escapeHtml(s.producto)}: ${s.cantidad} ${escapeHtml(s.unidad)}`).join(" · ")}</div>` : ""}
      </div>
    </div>
    <div class="res-footer">
      <div id="countdown-bar"><div id="countdown-fill"></div></div>
      <button class="new-btn" onclick="showHome()">Nuevo registro</button>
    </div>
  `;
  document.getElementById("resumen-content").innerHTML = html;
  startAutoReturn();
  checkStale(data.timestamp);
}

function checkStale(timestamp) {
  const banner = document.getElementById("stale-banner");
  if (secondsSince(timestamp) > CONFIG.staleAfterSeconds) {
    banner.classList.add("show");
  } else {
    banner.classList.remove("show");
  }
}

function renderState(msgBig, msgSmall, tipo) {
  showResumenShell(tipo || "proceso");
  document.getElementById("resumen-content").innerHTML = `
    <div class="state-msg">
      <div class="big">${escapeHtml(msgBig)}</div>
      <div class="small">${escapeHtml(msgSmall)}</div>
      <button class="new-btn" onclick="showHome()" style="margin-top:2vh;">Volver al inicio</button>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadSummary(tipo, id) {
  renderState("Cargando el resumen…", "", tipo);
  try {
    const url = CONFIG.dataEndpoint + "?tipo=" + encodeURIComponent(tipo) + "&id=" + encodeURIComponent(id || "");
    const resp = await fetch(url, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    if (data.tipo === "recepcion") renderRecepcion(data);
    else renderProceso(data);
  } catch (err) {
    renderState("No se pudo cargar el resumen", "Revisa la conexión o el endpoint configurado. (" + err.message + ")", tipo);
  }
}

/* ---------- arranque ---------- */
function init() {
  const params = new URLSearchParams(location.search);
  const view = params.get("view");
  if (view === "resumen") {
    const tipo = params.get("tipo") === "recepcion" ? "recepcion" : "proceso";
    const id = params.get("id") || params.get("instanceID") || params.get("submission") || "";
    loadSummary(tipo, id);
  } else {
    showHome();
  }
}
init();
